name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: mysql-8
            image: mysql:8.0
            root_password: ci_root_pass
            database: baronbakeshop_ci
          - name: mysql-5.7
            image: mysql:5.7
            root_password: ci_root_pass
            database: baronbakeshop_ci
            label: "production target"
          - name: mariadb-10.6
            image: mariadb:10.6
            root_password: ci_root_pass
            database: baronbakeshop_ci

    services:
      mysql:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ matrix.db.root_password }}
          MARIADB_ROOT_PASSWORD: ${{ matrix.db.root_password }}
          MYSQL_DATABASE: ${{ matrix.db.database }}
          MARIADB_DATABASE: ${{ matrix.db.database }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI target database
        run: echo "Running matrix for ${{ matrix.db.name }}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, json, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.ci .env

      - name: Create storage directories
        run: mkdir -p storage/logs storage/cache/disyl storage/cache/cms storage/uploads

      - name: Configure test hosts
        run: echo "127.0.0.1 applicationos.test" | sudo tee -a /etc/hosts

      - name: Run control-plane migrations
        run: php ikabud migrate:control

      - name: Seed CI tenant control data
        run: php database/seeds/ci_tenants.php

      - name: Run application migrations
        run: php ikabud migrate

      - name: Create clientsite CI database
        run: mysql -h 127.0.0.1 -u root -pci_root_pass -e "CREATE DATABASE IF NOT EXISTS clientsite_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Create healthcare CI database
        run: mysql -h 127.0.0.1 -u root -pci_root_pass -e "CREATE DATABASE IF NOT EXISTS healthcare_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Run clientsite migrations
        env:
          APP_TENANT_DEFAULT: "2"
        run: php -d variables_order=EGPCS ikabud migrate

      - name: Run healthcare tenant migrations
        env:
          APP_TENANT_DEFAULT: "3"
        run: php -d variables_order=EGPCS ikabud migrate

      - name: Seed clientsite database
        run: |
          mysql -h 127.0.0.1 -u root -pci_root_pass clientsite_ci < modules/cms/database/seeds/001_cms_baseline_content_types.sql
          mysql -h 127.0.0.1 -u root -pci_root_pass clientsite_ci < database/seeds/ci_clientsite.sql

      - name: Configure anti-spam for CI testing
        run: |
          mysql -h 127.0.0.1 -u root -pci_root_pass baronbakeshop_ci -e "INSERT INTO antispam_settings (setting_key, setting_value) VALUES ('rate_limit_max', '1000') ON DUPLICATE KEY UPDATE setting_value = '1000';" 2>/dev/null || true
          mysql -h 127.0.0.1 -u root -pci_root_pass clientsite_ci -e "INSERT INTO antispam_settings (setting_key, setting_value) VALUES ('rate_limit_max', '1000') ON DUPLICATE KEY UPDATE setting_value = '1000';" 2>/dev/null || true

      - name: Start PHP development server
        run: |
          sudo -E php -S 127.0.0.1:80 -t public/ > /tmp/php-server.log 2>&1 &
          sleep 3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            modules/cms/builder-ui/package-lock.json

      - name: Build and verify Workbench assets
        run: |
          npm ci
          npm run build:tailwind
          php tests/workbench_profile_contract_test.php
          git diff --exit-code -- public/assets/workbench/workbench-tailwind.css storage/application-profiles/ark-workbench/assets/workbench-tailwind.css storage/application-profiles/ark-workbench/assets/workbench-tailwind.src.css

      - name: Builder UI type-check
        working-directory: modules/cms/builder-ui
        run: npm ci && npm run type-check

      - name: DiSyL template lint
        run: php _lint_disyl.php --ci

      - name: Architecture boundary check
        run: php ikabud architecture:check

      - name: ARK theme static a11y audit
        run: php tests/ark_a11y_audit_test.php

      - name: Cross-theme regression suite
        run: php tests/theme_regression_test.php

      - name: Run test suite
        run: composer test

      - name: Composer audit (dependency vulnerability scan)
        run: composer audit --no-interaction

      - name: Generate release manifest
        run: php scripts/generate-release-manifest.php

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 30

      - name: Upload log artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: storage/logs/
          retention-days: 7

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, json, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan static analysis
        continue-on-error: true
        run: composer analyse -- --no-progress --error-format=github

  coding-standards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, json, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP-CS-Fixer coding standards
        continue-on-error: true
        run: composer lint -- --dry-run --diff --show-progress=dots
