<VirtualHost *:80>
    ServerName applicationkernel.test
    DocumentRoot /var/www/html/applicationkernel/public

    <Directory /var/www/html/applicationkernel/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/applicationkernel_error.log
    CustomLog ${APACHE_LOG_DIR}/applicationkernel_access.log combined
</VirtualHost>
