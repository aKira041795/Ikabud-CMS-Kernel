<VirtualHost *:80>
    ServerName moto.test
    DocumentRoot /var/www/html/applicationostest/public

    ErrorLog /var/log/apache2/moto.test.error.log
    CustomLog /var/log/apache2/moto.test.access.log combined

    <Directory /var/www/html/applicationostest/public>
        Require all granted
        AllowOverride All
        Options Indexes FollowSymLinks
    </Directory>

    <IfModule mod_rewrite.c>
        RewriteEngine On
    </IfModule>

</VirtualHost>
