<VirtualHost *:80>
    ServerName aiss.test
    DocumentRoot /var/www/html/applicationostest/public

    ErrorLog /var/log/apache2/aiss.error.log
    CustomLog /var/log/apache2/aiss.access.log combined

    <Directory /var/www/html/applicationostest/public>
        Require all granted
        AllowOverride All
        Options Indexes FollowSymLinks
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    <IfModule mod_rewrite.c>
        RewriteEngine On
    </IfModule>

</VirtualHost>
