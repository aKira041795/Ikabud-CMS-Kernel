<VirtualHost *:80>
    ServerName ccimoodle.test
    DocumentRoot /var/www/html/ccimoodle

    <Directory /var/www/html/ccimoodle>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ccimoodle_error.log
    CustomLog ${APACHE_LOG_DIR}/ccimoodle_access.log combined
</VirtualHost>