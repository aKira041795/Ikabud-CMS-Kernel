<VirtualHost *:80>
    ServerName clientsite.test
    DocumentRoot /var/www/html/baronbakeshop

    <Directory /var/www/html/baronbakeshop>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/clientsite_error.log
    CustomLog ${APACHE_LOG_DIR}/clientsite_access.log combined
</VirtualHost>
