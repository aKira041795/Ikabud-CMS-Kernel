<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <title>Moto Inventory — Offline</title>
    <link rel="manifest" href="/moto-inventory/manifest.json">
    <link rel="icon" type="image/png" href="/moto-inventory/favicon.png">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #f5f1e8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }

        .card {
            max-width: 380px;
        }

        img {
            width: 96px;
            height: 96px;
            border-radius: 20px;
            background: #fff;
            object-fit: contain;
            padding: 8px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 18px 0 8px;
        }

        p {
            color: rgba(245, 241, 232, .74);
            line-height: 1.55;
            margin: 0 0 18px;
        }

        .btn {
            display: inline-block;
            background: #d97706;
            color: #fff;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="/moto-inventory/icon-192.png" alt="Moto Inventory logo" width="96" height="96">
        <h1>Moto Inventory</h1>
        <p>You are offline. The catalog shown here is a read-only cache — sales, void, import, adjustment, and restore
            cannot be completed until you reconnect to the server.</p>
        <a class="btn" href="/moto-inventory">Try again</a>
    </div>
</body>

</html>
